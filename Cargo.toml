[package]
name = "yapper"
version = "0.1.5"
edition = "2024"
description = "Push-to-talk speech-to-text for Wayland, with a small GTK4 window"
license = "MIT"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
# Only for `user_state_dir`, which gtk's own glib feature level leaves out.
glib = { version = "0.22", features = ["v2_72"] }
gtk-layer-shell = { package = "gtk4-layer-shell", version = "0.8" }
cpal = "0.18"
# The speech models: Canary, Parakeet, Moonshine, SenseVoice. The build script
# fetches a prebuilt static library, so the binary is self-contained and
# inference never leaves the machine.
sherpa-onnx = "1.13"
anyhow = "1"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
