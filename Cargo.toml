[package]
name = "yapper"
version = "0.1.4"
edition = "2024"
description = "Push-to-talk speech-to-text for Wayland, with a small GTK4 window"
license = "MIT"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
# Only for `user_state_dir`, which gtk's own glib feature level leaves out.
glib = { version = "0.22", features = ["v2_72"] }
gtk-layer-shell = { package = "gtk4-layer-shell", version = "0.8" }
cpal = "0.18"
whisper-rs = "0.16"
anyhow = "1"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
libc = "0.2"

[features]
# Whisper inference on the GPU. The backend is linked at build time, so a
# machine without the Vulkan SDK needs --no-default-features to build at all.
default = ["vulkan"]
vulkan = ["whisper-rs/vulkan"]
cuda = ["whisper-rs/cuda"]

[profile.release]
opt-level = 3
lto = "thin"
