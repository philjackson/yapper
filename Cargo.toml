[package]
name = "yapper"
version = "0.1.0"
edition = "2024"
description = "Push-to-talk speech-to-text for Wayland, with a small GTK4 window"
license = "MIT"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
cpal = "0.18"
whisper-rs = "0.16"
anyhow = "1"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"
libc = "0.2"

[features]
# Offload whisper inference to the GPU. Requires the matching SDK at build time.
vulkan = ["whisper-rs/vulkan"]
cuda = ["whisper-rs/cuda"]

[profile.release]
opt-level = 3
lto = "thin"
