name: Release

# Tag a commit and the binary shows up under Releases. The manual trigger runs
# the same build without publishing, which is how to check a change to this
# file before tagging something for real.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Built on Arch rather than the runner's Ubuntu: yapper needs libadwaita
    # 1.6+ and gtk4-layer-shell, and Ubuntu 24.04 has neither. The trade is
    # that the binary wants a rolling distro's glibc to run.
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git github-cli rust cargo \
            gtk4 libadwaita gtk4-layer-shell \
            alsa-lib

      - uses: actions/checkout@v4

      # The cache is keyed on the compiler as well as the lockfile: Arch moves
      # rustc often, and artifacts built by a different one are rebuilt anyway,
      # so a stale hit would cost the download for nothing.
      - name: Identify the toolchain
        id: toolchain
        run: echo "id=$(rustc --version | tr ' /' '--')" >> "$GITHUB_OUTPUT"

      # registry/src and target/*/incremental are left out deliberately: both
      # are rebuilt from what is cached, and both are larger than the rest put
      # together.
      - name: Cache dependencies and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.toolchain.outputs.id }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ steps.toolchain.outputs.id }}-

      - name: Build
        env:
          CARGO_INCREMENTAL: "0"
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Package
        id: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="${GITHUB_SHA::7}"
          name="yapper-${version}-x86_64-linux"

          mkdir -p "dist/$name"
          cp target/release/yapper README.md LICENSE "dist/$name/"
          cp -r data "dist/$name/"

          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" )
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*.tar.gz

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --repo rather than relying on git detection: the checkout is owned
          # by a different uid inside the container and git baulks at it.
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Built on Arch. Needs GTK4, libadwaita, gtk4-layer-shell, wl-clipboard and curl at runtime; yapper downloads a model itself on first run. See the README." \
            dist/*.tar.gz dist/*.sha256
