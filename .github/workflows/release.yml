name: Release

# Tag a commit and the binary shows up under Releases. The manual trigger runs
# the same build without publishing, which is how to check a change to this
# file before tagging something for real.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Built on Arch rather than the runner's Ubuntu: yapper needs libadwaita
    # 1.6+ and gtk4-layer-shell, and Ubuntu 24.04 has neither. The trade is
    # that the binary wants a rolling distro's glibc to run.
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git github-cli rust cargo cmake clang \
            gtk4 libadwaita gtk4-layer-shell \
            alsa-lib \
            vulkan-headers vulkan-icd-loader shaderc

      - uses: actions/checkout@v4

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Package
        id: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="${GITHUB_SHA::7}"
          name="yapper-${version}-x86_64-linux"

          mkdir -p "dist/$name"
          cp target/release/yapper README.md LICENSE "dist/$name/"
          cp -r data scripts "dist/$name/"

          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" )
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*.tar.gz

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --repo rather than relying on git detection: the checkout is owned
          # by a different uid inside the container and git baulks at it.
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Built on Arch with Vulkan. Needs GTK4, libadwaita, gtk4-layer-shell, wl-clipboard and a Vulkan loader at runtime, plus a Whisper model — see the README." \
            dist/*.tar.gz dist/*.sha256
